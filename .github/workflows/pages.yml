# Publishes the Listening Archive: downloads archive.zip from the "site" release and deploys it to GitHub Pages.
name: Pages

# Run by hand after uploading a new archive.zip (a release-triggered run would deploy from the tag,
# which the github-pages environment does not allow).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the site from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site --repo "$GITHUB_REPOSITORY" --pattern archive.zip
          unzip -q archive.zip
          mv archive_site _site
          echo "files: $(find _site -type f | wc -l)  size: $(du -sh _site | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
